<!doctype html>
<html lang="en-US">
    <head>
        <!-- Basic metadata -->
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Type" content="text/html"/>
        <base target="_blank" href="/" />

        <!-- Theming -->
        <meta name="theme-color" content="#522672" />
        <meta name="background-color" content="#fff" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />

        <!-- About -->
        <title>Bryn Madoc Event Schedule</title>
        <meta name="description" content="A list of events in the barony of Bryn Madoc (part of the SCA — Society for Creative Anachronism)." />
        <meta keywords="Athens, Georgia, Bryn Madoc, SCA, Society for Creative Anachronism, Meridies" />

        <!-- 3rd-Party Dependencies -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Alice&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&display=block" rel="stylesheet" />

        <!-- 1st-Party Dependencies -->
        <link rel="icon" href="/res/coa.svg" />
        <link rel="stylesheet" href="/lib/styles.css" />
        <script src="/lib/script.js" defer></script>
    </head>
    <!-- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -->
    <body>
        <div id="root">

            <!-- Decorative header -->
            <header id="header">
                <div class="header-text">
                    <div class="header-text-pre header-text-decorated">The Barony of</div>
                    <div class="header-text-main">Bryn Madoc</div>
                    <div class="header-text-divider header-text-decorated">☆ ☆ ☆</div>
                    <h1 class="header-text-post">
                        <span id="overall-date"></span>
                        Schedule
                    </h1>
                </div>
                <img class="header-image" src="/res/coa.svg" />
            </header>

            <!-- Error-handling -->
            <noscript class="error-message">
                This webpage requires JavaScript; please enable and refresh.
            </noscript>
            <div id="nostyle" aria-hidden="true">
                Styles did not load; please check console or try refreshing.
            </div>
            <div id="loading-error" class="error-message" style="display:none">
                Error encountered while loading; please check console or try refreshing.
            </div>
            <div id="loading-spinner" class="spinner"></div>

            <!-- Events lists -->
            <section id="events"></section>
            <footer id="footer">
                <div class="footer-text">
                    <div class="footer-text-left">All of these functions are open to everyone!</div>
                    <div class="footer-text-right">
                        <div class="footer-text-right-top">Scan QR code for full calendar:</div>
                        <div class="footer-text-right-bottom">https://brynmadoc.meridies.org/calendar</div>
                    </div>
                </div>
                <div class="footer-image-wrapper">
                    <img src="/res/qr.svg" />
                </div>
            </footer>

        </div>
    </body>
</html>

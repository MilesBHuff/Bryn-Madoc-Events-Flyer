<!doctype html>
<html lang="en-US">
    <head>
        <!-- Basic metadata -->
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Type" content="text/html"/>

        <!-- Theming -->
        <meta name="theme-color" content="#35136d" />
        <meta name="background-color" content="#fff" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />

        <!-- About -->
        <title>Bryn Madoc Event Schedule</title>
        <meta name="description" content="A list of events in the barony of Bryn Madoc (part of the SCA — Society for Creative Anachronism)." />
        <meta keywords="Athens, Georgia, Bryn Madoc, SCA, Society for Creative Anachronism, Meridies" />

        <!-- Dependencies -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

        <!-- Code -->
        <script>
            'use strict';
            const main = async() => {
                try {
                    const data = await (await fetch('./events.json')).json();
                    globalThis.document.getElementById('loading').style.display = 'none';
                    const monthDisplay =  new Intl.DateTimeFormat('en-US', {month: 'long'}).format(new Date(data.year, data.month - 1));
                    globalThis.document.getElementById('overall-date').innerText = `${monthDisplay} ${data.year}`;

                    const eventsTable = globalThis.document.createElement('table');
                    eventsTable.classList.add('events-table');
                    for(const event of data.events) {
                        const row = eventsTable.insertRow();
                        const dateCell = row.insertCell();
                        const mainCell = row.insertCell();
                        const moreCell = row.insertCell();

                        row.classList.add('events-table-row');
                        dateCell.classList.add('events-table-cell', 'events-table-cell-date');
                        mainCell.classList.add('events-table-cell', 'events-table-cell-main');
                        moreCell.classList.add('events-table-cell', 'events-table-cell-more');
                        if(event.details) moreCell.classList.add('events-table-cell', 'events-table-cell-more-details');

                        dateCell.innerHTML = `
<div class="events-table-cell-day">${event.day}</div>
<div class="events-table-cell-time">${event.time}</div>
`;
                        mainCell.innerHTML = `
<div class="events-table-cell-title">${event.title}</div>
<div class="events-table-cell-location"><span class="events-table-cell-location-header">Location:</span> ${event.location}</div>
<div class="events-table-cell-schedule">${event.schedule}</div>
`;
                        if(event.details) moreCell.innerHTML = `
<div class="events-table-cell-details">${event.details}</div>
`;
                    }
                    globalThis.document.getElementById('events').appendChild(eventsTable);
                } catch(error) {
                    console.error(error);
                }
            }
            main();
        </script>
        <style>
            :root {
                --purple: #35136d;
                --gold: #c99716;
            }
            .root {
                max-width: 1024px;
                padding: 1rem;
                font-family: "Alice", serif;
                font-size: 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */
            .spinner {
                aspect-ratio: 1;
                width: 2rem;
                border: 0.25rem solid var(--purple);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner 1s linear infinite;
            }
            @keyframes spinner {
                to {
                    transform: rotate(360deg);
                }
            }

            /* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */
            .header {
                width: 100%;
                display: flex;
                gap: 3rem;
                align-items: center;
                margin-bottom: 1rem;
            }
            .header-image {
                height: 15rem;
            }
            .header-text {
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align: center;
                font-variant-caps: small-caps;
                color: var(--purple);
            }
            .header-text >* {
                line-height: 100%;
            }
            .header-text-pre {
                font-size: 2.5rem;
                line-height: 80%;
            }
            .header-text-main {
                font-size: 7.5rem;
                line-height: 80%;
            }
            .header-text-post {
                font-size: 2.5rem;
            }
            .header-text-divider {
                font-size: 2.5rem;
            }
            .header-text-decorated {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .header-text-decorated::before,
            .header-text-decorated::after {
                content: "";
                flex: 1;
                border-top: 0.125rem solid var(--gold);
            }

            /* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */
            .footer {
                color: var(--purple);
                font-style: italic;
                text-align: center;
                font-size: 1.5rem;
                margin-top: 1rem;
            }

            /* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */
            .events-table {
                border-collapse: separate;
                border-spacing: 0 0.5rem;
            }
            .events-table-row {
            }
            .events-table-cell {
                padding: 0.5rem 1rem;
            }
            .events-table-cell-date {
                background-color: var(--purple);
                color: white;
                border-radius: 1rem 0 0 1rem;
                border: 1px solid var(--purple);
                border-right: 0;
                text-align: center;
            }
            .events-table-cell-main {
                border: 1px solid var(--purple);
                border-left: 0;
                border-right: 0;
            }
            .events-table-cell-more {
                border-radius: 0 1rem 1rem 0;
                border-top: 1px solid var(--purple);
                border-right: 1px solid var(--purple);
                border-bottom: 1px solid var(--purple);
                position: relative;
            }
            .events-table-cell-more-details::before {
                content: "";
                position: absolute;
                border-left: 1px solid var(--gold);
                top: 10%;
                bottom: 10%;
            }

            /* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */
            .events-table-cell-day {
                font-variant-caps: small-caps;
                font-size: 2.5rem;
            }
            .events-table-cell-time {
                font-variant-caps: small-caps;
            }
            .events-table-cell-title {
                font-variant-caps: small-caps;
                color: var(--purple);
                font-size: 2rem;
                width: max-content;
            }
            .events-table-cell-location {
            }
            .events-table-cell-location-header {
                font-variant-caps: small-caps;
                color: var(--purple);
            }
            .events-table-cell-schedule {
                font-style: italic;
                line-height: 150%;
            }
            .events-table-cell-details {
                font-style: italic;
                padding-left: 1rem;
            }
        </style>
    </head>

    <body>    
        <div id="root" class="root">
            <noscript>This webpage requires JavaScript.</noscript>
            <div id="header" class="header">
                <img class="header-image" src="./res/coa.png"/>
                <div class="header-text">
                    <div class="header-text-pre header-text-decorated">The Barony of</div>
                    <div class="header-text-main">Bryn Madoc</div>
                    <div class="header-text-divider header-text-decorated">⚜</div>
                    <div class="header-text-post">
                        <span id="overall-date"></span>
                        Meeting Schedule
                    </div>
                </div>
            </div>
            <div id="loading" class="spinner"></div>
            <div id="events"></div>
            <div id="footer" class="footer">
                All of these functions are open to everyone!
            </div>
        </div>
    </body>
</html>
